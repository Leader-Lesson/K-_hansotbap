<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한솥밥 현장 상황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <div class="brand">
      <!-- 로고: 밥공기에 고봉밥 (🍚) -->
      <svg class="logo" viewBox="0 0 40 40" role="img" aria-label="한솥밥 로고">
        <path d="M8 21c0-8.6 5.4-14.5 12-14.5S32 12.4 32 21z" fill="#fff" stroke="#b9c2ce" stroke-width="1.3" stroke-linejoin="round"/>
        <g fill="#d3d9e1"><ellipse cx="15" cy="14.5" rx="1.1" ry=".7" transform="rotate(-30 15 14.5)"/><ellipse cx="20.5" cy="11.2" rx="1.1" ry=".7" transform="rotate(20 20.5 11.2)"/><ellipse cx="25" cy="15.5" rx="1.1" ry=".7" transform="rotate(35 25 15.5)"/><ellipse cx="19" cy="17.6" rx="1.1" ry=".7" transform="rotate(-10 19 17.6)"/><ellipse cx="12.2" cy="19" rx="1.1" ry=".7" transform="rotate(15 12.2 19)"/><ellipse cx="27.8" cy="19.4" rx="1.1" ry=".7" transform="rotate(-20 27.8 19.4)"/></g>
        <path d="M4.5 20.5h31c0 8.2-6.9 13.5-15.5 13.5S4.5 28.7 4.5 20.5z" fill="#2457c5"/>
        <path d="M4.5 20.5h31" stroke="#4f7ee0" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M14.5 33.2h11l-1 3h-9z" fill="#1b3f91"/>
      </svg>
      <div><div class="n">한솥밥</div><div class="s">광양 2고로 개수 · 세이프루프</div></div>
    </div>
    <div class="clock"><span class="big" id="hClock">10:30</span><span class="when"><span class="daynav"><button data-act="dprev" aria-label="전날">‹</button><input type="date" id="dateIn" class="datein" min="2026-11-12" max="2027-03-23" aria-label="기준 날짜"><button data-act="dnext" aria-label="다음날">›</button></span><span class="sub" id="hD"></span></span></div>
    <nav class="tabs" aria-label="화면">
      <button class="tab" data-view="board">현재 상황판</button>
      <button class="tab" data-view="model">3D · 충돌</button>
      <button class="tab" data-view="tbm">TBM 확인</button>
      <button class="tab" data-view="history">이력</button>
    </nav>
    <div class="right">
      <label class="role" for="role"><span class="sub" hidden>역할</span><select id="role" aria-label="보는 사람"></select></label>
      <button class="bell" data-act="bell" aria-label="알림"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9M10 20a2 2 0 0 0 4 0"/></svg><span class="badge" id="bellN" hidden></span></button>
      <button class="upbtn" data-act="openup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>계획서 올리기<span class="badge" id="upBadge" hidden></span></button>
      <span class="synth">합성 데이터</span>
    </div>
  </div>
  <div id="urgentHost" aria-live="assertive"></div>
</header>
<!-- 시연 띠: 기본은 접힌 한 줄(진행 n/12 · 단계 이름 · 다음 단계), 펼치면 12단계 버튼. 열림 상태는 sessionStorage "hansotbap.scenOpen" -->
<section class="scen" aria-label="시연 순서"><div class="wrap"><span class="l">시연</span><span class="ssum" id="scenSum"></span><ol id="scen" hidden></ol><button class="link" id="scenTg" data-act="scen" aria-controls="scen" aria-expanded="false">펼치기 ▾</button><button class="link" data-act="reset">처음으로</button></div></section>

<main class="wrap">
  <section class="view" id="view-board" hidden>
    <div id="bBanner"></div>
    <div class="stats" id="bStats"></div>
    <div id="bHold"></div>
    <div id="bGuide"></div>
    <section class="card">
      <header><h2>오늘 작업 시간표</h2><span class="sub" id="bTlSub">07:00–19:00 · 30분 칸 · 구역은 위층부터</span><span class="grow"></span><div class="jumps" id="bJumps"></div></header>
      <div class="tlbar" id="bTime"></div>
      <div class="tl-wrap" id="bTl"></div>
      <div class="tl-legend">
        <span><i class="sw" style="background:var(--red)"></i>금지 겹침</span><span><i class="sw" style="background:var(--amber)"></i>조건부 겹침</span><span><i class="sw" style="background:var(--blue);width:3px"></i>지금</span>
        <span>위 띠: 위험 시간대 예보 <span class="fx">F9</span></span><span>점선 막대: 조정으로 옮겨진 작업</span><span><i class="sw sband day"></i>주간조</span><span><i class="sw sband hov"></i>인계 30분</span><span><i class="sw sband night"></i>야간조</span>
      </div>
    </section>
    <section class="acts" id="bActs"></section>
  </section>

  <section class="view" id="view-model" hidden>
    <section class="card s3card" id="s3card">
      <header><h2>고로 3D · 충돌</h2><span class="fx">F3 scene3d</span><span class="sub" id="s3info">불러오는 중…</span><span class="grow"></span></header>
      <div class="s3frame" id="s3frame"></div>
    </section>
  </section>

  <section class="view" id="view-tbm" hidden><div id="tbmBody"></div></section>
  <section class="view" id="view-history" hidden><div id="hBody"></div></section>
</main>

<div id="drawerHost"></div>
<div id="chatHost"></div>
<button class="fab" data-act="chat" aria-label="AI 챗봇 열기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01" stroke-width="2.6"/></svg>AI</button>
<div id="notiHost"></div>
<div id="toastHost"></div>
<script src="assets/js/app.js"></script>
</body>
</html>
