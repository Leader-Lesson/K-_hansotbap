<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>한솥밥 · 고로 3D 단면도</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./src/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="app">
    <!-- 상단 바 -->
    <header class="topbar">
      <div class="brand">
        <span class="logo">한솥밥</span>
        <span class="divider">|</span>
        <span class="page-title">고로 3D · 단면도</span>
        <span class="site">광양 2고로 개수</span>
      </div>
      <div class="top-mid">
        <span class="date">2027-01-21 (목) <b>D71</b></span>
        <span class="tag-synth">합성 데이터</span>
      </div>
      <div class="summary" id="summary" aria-live="polite"></div>
    </header>

    <!-- 왼쪽 층 목록 -->
    <nav class="floors" aria-label="층 선택">
      <div class="floors-title">층 선택</div>
      <button class="floor-btn floor-all active" id="btnAll" type="button">
        <span class="floor-name">전체 층</span>
        <span class="badge" id="badgeAll">0</span>
      </button>
      <div id="floorList" class="floor-list"></div>
    </nav>

    <!-- 가운데 뷰 영역 -->
    <main class="stage">
      <div class="stage-tools">
        <div class="seg" role="tablist" aria-label="보기 방식">
          <button type="button" class="seg-btn active" id="mode3d">3D</button>
          <button type="button" class="seg-btn" id="mode2d" disabled title="층을 먼저 고르세요">2D 도면</button>
        </div>
        <label class="explode" id="explodeWrap">
          <span>층 펼치기</span>
          <input type="range" id="explode" min="0" max="100" value="0" />
        </label>
        <div class="stage-hint" id="stageHint">구역을 누르면 오른쪽에 자세히 보입니다</div>
        <button type="button" class="btn-full" id="btnFull" title="F 키">⛶ 전체 화면</button>
      </div>
      <div class="view" id="view">
        <div class="canvas-wrap" id="canvasWrap"></div>
        <button type="button" class="exit-focus" id="btnExitFocus" hidden>‹ 전체 보기 <small>(집중 보기 해제)</small></button>
        <div class="plan-wrap" id="planWrap" hidden></div>
      </div>
      <div class="legend" aria-label="범례">
        <span class="lg"><i class="sw" data-sev="PROHIBITED"></i><span data-label="PROHIBITED">금지</span></span>
        <span class="lg"><i class="sw" data-sev="CONDITIONAL"></i><span data-label="CONDITIONAL">조건부</span></span>
        <span class="lg"><i class="sw" data-sev="DEFECT"></i><span data-label="DEFECT">결함</span></span>
        <span class="lg"><i class="sw sw-none"></i>충돌 없음</span>
      </div>
    </main>

    <!-- 오른쪽 상세 패널 -->
    <aside class="detail" id="detail">
      <button type="button" class="detail-toggle" id="detailToggle" aria-label="패널 접기">›</button>
      <div class="detail-body" id="detailBody"></div>
    </aside>

    <!-- 하단 시간 슬라이더 -->
    <footer class="timebar">
      <button type="button" class="play" id="play" aria-label="재생">▶</button>
      <div class="time-now" id="timeLabel">21:00</div>
      <div class="slider-wrap">
        <input type="range" id="time" min="0" max="48" step="1" value="28" />
        <div class="now-marker" id="nowMarker"><span>지금</span></div>
        <div class="ticks" id="ticks"></div>
      </div>
      <button type="button" class="btn-now" id="btnNow">지금으로</button>
    </footer>
  </div>
  <button type="button" class="full-exit" id="btnFullExit">전체 화면 닫기 (Esc)</button>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
