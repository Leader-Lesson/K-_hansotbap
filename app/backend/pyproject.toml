[project]
name = "hansotbap-backend"
version = "0.1.0"
description = "한솥밥 — 고로 개수 협력사 동시작업 간섭 감지·예보 (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "anthropic>=0.40",
    "openai>=1.40",
    "pymupdf>=1.24",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "faiss-cpu>=1.15.1",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
